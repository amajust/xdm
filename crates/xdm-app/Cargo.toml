[package]
name = "xdm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "XDM desktop app and CLI (Rust rewrite, iced GUI)"

[dependencies]
xdm-core = { path = "../xdm-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "crisp", "svg", "wayland", "x11", "tokio"] }

[target.'cfg(target_os = "linux")'.dependencies]
# D-Bus StatusNotifier tray; macOS/Windows close = quit (no tray to hide to).
ksni = "0.3"
