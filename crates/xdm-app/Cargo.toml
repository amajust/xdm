[package]
name = "xdm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "XDM desktop app and CLI (Rust rewrite, iced GUI)"

[dependencies]
xdm-core = { path = "../xdm-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "crisp", "svg", "wayland", "x11", "tokio"] }
# Logo decoding for the window/taskbar icon and the Linux tray pixmap.
image = { version = "0.25", default-features = false, features = ["png"] }

# Embeds the icon into the exe: Explorer and the Windows taskbar show it
# before (and without) any window being created. Always a build-dependency
# (build.rs compiles for the host); gated on the target OS inside build.rs,
# so cross-compilation works too.
[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# D-Bus StatusNotifier tray; macOS/Windows close = quit (no tray to hide to).
ksni = "0.3"
